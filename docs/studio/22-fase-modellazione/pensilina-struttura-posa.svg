<rect x="560" y="386" width="300" height="112" rx="8" fill="#ffffff" stroke="#b8ada3" stroke-width="1"/>
<text x="570" y="408" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Orientamento</text>
<text x="850" y="408" font-family="Segoe UI" font-size="10" fill="#2b2622" text-anchor="end" font-weight="normal">lungo la falda ▾</text>
<text x="570" y="430" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">File di moduli</text>
<text x="850" y="430" font-family="Segoe UI" font-size="10" fill="#2b2622" text-anchor="end" font-weight="normal">2 (riempie la profondità)</text>
<text x="570" y="452" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Sporto oltre la struttura</text>
<text x="850" y="452" font-family="Segoe UI" font-size="10" fill="#2b2622" text-anchor="end" font-weight="normal">0,20 m</text>
<text x="570" y="474" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Bordo</text>
<text x="850" y="474" font-family="Segoe UI" font-size="10" fill="#2b2622" text-anchor="end" font-weight="normal">0,10 m</text>
<text x="880" y="410" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Una sola falda = un sottocampo; i moduli</text>
<text x="880" y="426" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">coprono tutta la falda, senza file né</text>
<text x="880" y="442" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">corridoi: niente «passo», niente «altezza</text>
<text x="880" y="458" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">dal piano». La pendenza è quella della struttura.</text>
<text x="880" y="486" font-family="Segoe UI" font-size="10" fill="#3f7d4a" text-anchor="start" font-weight="bold">Nessun modulo appare in Modellazione.</text></svg>