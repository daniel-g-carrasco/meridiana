<text x="20" y="30" font-family="Segoe UI" font-size="15" fill="#2b2622" text-anchor="start" font-weight="bold">Lati cliccabili in pianta (R276) e anteprima 3D cliccabile nelle finestrelle (R282)</text>
<text x="20" y="66" font-family="Segoe UI" font-size="12" fill="#2b2622" text-anchor="start" font-weight="bold">Pianta, edificio selezionato: numero del lato e misura nella stessa pillola; un clic apre il campo lì</text>
