<text x="1007" y="394" font-family="Segoe UI" font-size="9" fill="#7a6f66" text-anchor="middle" font-weight="normal">trascina per girare · clic su un lato per scriverlo</text>
<text x="576" y="378" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Anteprima 3D: assonometria</text>
<text x="576" y="392" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">QPainter, niente Qt Quick 3D;</text>
<text x="576" y="406" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">si aggiorna a ogni valore.</text>
<text x="576" y="440" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Crea solo la struttura: pilastri, travi, piano di copertura. I moduli si posano nella fase Impianto (Pannelli › Su pensilina).</text>
<rect x="940" y="480" width="130" height="30" rx="6" fill="#f0e3d1" stroke="#8a5a1e" stroke-width="1"/>
<text x="1005" y="500" font-family="Segoe UI" font-size="11" fill="#2b2622" text-anchor="middle" font-weight="normal">Mettila in pianta</text>
<rect x="1080" y="480" width="100" height="30" rx="6" fill="#ffffff" stroke="#b8ada3" stroke-width="1"/>
<text x="1130" y="500" font-family="Segoe UI" font-size="11" fill="#2b2622" text-anchor="middle" font-weight="normal">Annulla</text>
<text x="20" y="590" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Lo stesso widget di anteprima serve a «Da modello» (prisma della pianta con tetto piano, lati numerati cliccabili), alla falda (scheda) e alla pensilina. Clic su un lato = il campo del modulo prende il fuoco e si accende; la misura si scrive lì o in una pillola sul lato.</text></svg>