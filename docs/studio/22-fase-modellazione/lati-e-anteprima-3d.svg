<text x="20" y="312" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Oggi: misure sì (plan._draw_sides, doppio clic → QInputDialog), numeri no;</text>
<text x="20" y="326" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">le Proprietà dicono «Lato 3» senza mostrarlo in pianta.</text>
<text x="20" y="344" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Dopo: pillola «③ 12,00 m», un clic (non doppio) apre il campo nella pillola; Invio tira il lato (sides.stretch).</text>
<text x="20" y="360" font-family="Segoe UI" font-size="10" fill="#7a6f66" text-anchor="start" font-weight="normal">Passando sul campo «Lato 3» delle Proprietà il lato 3 si accende in pianta (e viceversa).</text>
