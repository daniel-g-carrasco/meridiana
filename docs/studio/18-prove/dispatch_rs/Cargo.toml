[package]
name = "dispatch_rs"
version = "0.1.0"
edition = "2021"
description = "Meridiana's battery dispatch loop as a Rust extension: a measurement for register R31, not a feature"
license = "GPL-3.0-or-later"

[lib]
name = "dispatch_rs"
crate-type = ["cdylib"]

[dependencies]
# Measured with pyo3 0.27.2 and numpy 0.27.1 (C-prestazioni.md); raised to 0.29 for GHSA-36hh-v3qg-5jq4 and
# GHSA-chgr-c6px-7xpp. The crate is a study, never built by the CI nor shipped.
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
