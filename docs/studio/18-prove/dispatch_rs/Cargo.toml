[package]
name = "dispatch_rs"
version = "0.1.0"
edition = "2021"
description = "Meridiana's battery dispatch loop as a Rust extension: a measurement for register R31, not a feature"
license = "GPL-3.0-or-later"

[lib]
name = "dispatch_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
numpy = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
