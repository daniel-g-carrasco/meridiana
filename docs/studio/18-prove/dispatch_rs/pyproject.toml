[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dispatch_rs"
version = "0.1.0"
description = "Meridiana's battery dispatch loop as a Rust extension (a measurement for register R31)"
requires-python = ">=3.12"

[tool.maturin]
features = ["pyo3/extension-module"]
