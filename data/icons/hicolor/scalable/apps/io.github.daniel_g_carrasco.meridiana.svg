    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <path d="M30 40 h26 l8 8 h34 a4 4 0 0 1 4 4 v38 a4 4 0 0 1 -4 4 H30 a4 4 0 0 1 -4 -4 V44 a4 4 0 0 1 4 -4 z" fill="#f6f5f4" fill-opacity="0.95"/>
  <path d="M26 58 h76 v36 a4 4 0 0 1 -4 4 H30 a4 4 0 0 1 -4 -4 z" fill="#deddda"/>
  <path d="M50 78 l10 10 l20 -22" fill="none" stroke="#1a5fb4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
