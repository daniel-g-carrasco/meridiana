<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The app icon: a placeholder inherited from the app template (a tile in the
       GNOME blue with a folder and a mark), to be replaced by Meridiana's own;
       readable at 16 pixels too (thick shapes, no thin lines).
       tools/make_icons.py makes the PNG sizes from it, tools/make_ico.py the
       Windows .ico. -->
