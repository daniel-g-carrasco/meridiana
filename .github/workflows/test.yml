name: CI

# What runs, and when (study 18, theme H; study 43, step D2):
# - "linux" on every push of every branch, offscreen with the pip cache: ruff on the whole repository, the
#   catalogues checked and compiled, the test groups (nucleo holds the test of the layers, test_strati), the
#   desktop entry and the metainfo validated; "quick" runs the Quick subgroups in five shards side by side and "timed" the tests of a time, as a warning. The
#   studies and the tasks in docs/ do not start
#   it (the manual, docs/manuale, does: it ships with the program and has its tests); on a pull request it runs only
#   for a fork, whose pushes GitHub does not show here (a branch of this repository is already tested by its push).
# - The Windows package, the release and its signature are in release.yml, on a v* tag or by hand: never on a
#   plain commit, so the runner's Windows desktop is not a red mark on every push.
# The same commands run on the PC before a push: docs/progetto.md, section 4, "Publishing".
# The repository is public: GitHub Actions costs nothing, and the light flow keeps the queue short.
#
# The actions are pinned to a commit (rule of the template, docs/05-ci-rilascio.md): the SHAs are those of the tags
# read with gh api on 23/10/2026.

on:
  push:
    branches: ['**']
    # paths and not paths-ignore: the manual comes back after the rest of docs/ is left out (the last pattern
    # that matches a file decides)
    paths:
      - '**'
      - '!docs/**'
      - 'docs/manuale/**'
      - 'docs/quick/compat/**'
      - '!site/**'
      - '!.claude/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/manuale/**'
      - 'docs/quick/compat/**'
      - '!site/**'
      - '!.claude/**'
  workflow_dispatch:

# read-only: nothing here writes
permissions:
  contents: read

# a push on top of a push cancels the run of the older commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  linux:
    # a pull request only from a fork: a branch of this repository is tested by its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                      # the wheels downloaded, keyed on the hash of requirements.txt
      # libpulse0 and libspeechd2: Qt's sound and the system's voices (Meridio speaks; its tests ask for them)
      - name: Qt offscreen, gettext and the validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gettext desktop-file-utils appstream \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse0 libspeechd2
      - run: python -m pip install -r requirements.txt ruff
      - name: Ruff on the whole repository
        run: python -m ruff check --select F,E9,B .
      - name: The catalogues checked, then compiled
        run: |
          python tools/compile_po.py --check
          python tools/compile_po.py
      # the groups of tests/ (study 18, D 7.1), one at a time so that the log says which one failed: the core (with
      # the test of the layers), the calculations and the formats, offscreen; esterni only on Daniel's PC
      - name: Tests by group, offscreen
        run: |
          for group in nucleo calcoli formati; do
            echo "::group::tests/$group"
            python -W default tools/run_tests.py tests/$group || exit 1
            echo "::endgroup::"
          done
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.daniel_g_carrasco.meridiana.desktop
          appstreamcli validate --no-net data/io.github.daniel_g_carrasco.meridiana.metainfo.xml

  # the Quick subgroups in five shards of about the same length, side by side (tools/quick_rif_tests.py --shard): one
  # after the other they took about 65 minutes on Linux, past the 45 a job may take
  quick:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt offscreen and gettext
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gettext             libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3             libpulse0 libspeechd2
      - run: python -m pip install -r requirements.txt
      - run: python tools/compile_po.py
      # one process per subgroup of tests/quick, including the subgroups added by other branches
      - name: Quick interface subgroups, offscreen
        run: python -W default tools/quick_rif_tests.py --shard ${{ matrix.shard }}/5
        env:
          QT_QPA_PLATFORM: offscreen
          # the tests that assert a time run in the job "timed" below (tests/quick/aiuti/tempi.py)
          MERIDIANA_TIMED: skip
      - name: Keep Quick evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: quick-linux-evidence-${{ matrix.shard }}
          if-no-files-found: ignore
          path: build/quick-parity/

  # Explicit timing thresholds warn on the shared runner. Test failures, errors and incomplete coverage block.
  timed:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt offscreen and gettext
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gettext libegl1 libgl1 libxkbcommon0 libfontconfig1             libdbus-1-3 libpulse0 libspeechd2
      - run: python -m pip install -r requirements.txt
      - run: python tools/compile_po.py
      - name: Timed tests with functional checks
        run: python -W default tools/quick_rif_tests.py --timed-ci
        env:
          QT_QPA_PLATFORM: offscreen
