name: CI

# What runs, and when (study 18, theme H; task 18f):
# - "linux" on every push of every branch, offscreen with the pip cache: lint, catalogues, the test groups, the
#   desktop entry and the metainfo validated, the tag against __version__. The studies and the tasks in docs/
#   do not start it (the manual, docs/manuale, does: it ships with the program and has its tests); on a pull
#   request it runs only for a fork, whose pushes GitHub does not show here (a branch of this repository is
#   already tested by its push).
# - "windows" on a v* tag or by hand (workflow_dispatch, box "windows"): the suite on the runner's desktop, the
#   PyInstaller bundle and its checks, the bundle's self-test, the portable zip, the Inno Setup installer, a
#   silent install and an update over the running program.
# - "release" on a v* tag: signs the installer and the zip with minisign and uploads them. It does nothing until
#   the secret MINISIGN_SECRET_KEY exists (an environment secret of "release", docs/progetto.md section 4).
# The repository is public: GitHub Actions costs nothing, and the light flow keeps the queue short.
#
# The actions are pinned to a commit (rule of the template, docs/05-ci-rilascio.md): the SHAs are those of the tags
# read with gh api on 23/10/2026.

on:
  push:
    branches: ['**']
    tags: ['v*']
    # paths and not paths-ignore: the manual comes back after the rest of docs/ is left out (the last pattern
    # that matches a file decides)
    paths:
      - '**'
      - '!docs/**'
      - 'docs/manuale/**'
      - '!site/**'
      - '!.claude/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/manuale/**'
      - '!site/**'
      - '!.claude/**'
  workflow_dispatch:
    inputs:
      windows:
        description: 'Also the Windows job (suite on a real desktop, PyInstaller, Inno Setup)'
        type: boolean
        default: false

# read-only for every job: only "release" writes (the release itself), and it runs nothing of the build
permissions:
  contents: read

# a push on top of a push cancels the run of the older commit (a tag never)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  linux:
    # a pull request only from a fork: a branch of this repository is tested by its push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                      # the wheels downloaded, keyed on the hash of requirements.txt
      # libpulse0 and libspeechd2: Qt's sound and the system's voices (Meridio speaks; the self-test asks for them)
      - name: Qt offscreen, gettext and the validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gettext desktop-file-utils appstream \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libpulse0 libspeechd2
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m ruff check --select F,E9,B .
      - run: python tools/compile_po.py
      # the groups of tests/ (study 18, D 7.1), one at a time so that the log says which one failed: the core, the
      # calculations, the formats and the widgets, then the window offscreen; esterni only on Daniel's PC
      - name: Tests by group, offscreen
        run: |
          for group in nucleo calcoli formati widget finestra; do
            echo "::group::tests/$group"
            python -W default -m unittest discover -s tests/$group -t tests || exit 1
            echo "::endgroup::"
          done
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.daniel_g_carrasco.meridiana.desktop
          appstreamcli validate --no-net data/io.github.daniel_g_carrasco.meridiana.metainfo.xml
      - name: The tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(python -c 'import sys; sys.path.insert(0, "src"); import meridiana as p; print(p.__version__)')"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ = $v"; exit 1
          fi

  windows:
    # a tag, or asked by hand: the suite on a real desktop, then the package
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # (a step's name never holds a colon followed by a space: YAML takes it for a key, and GitHub refuses the
      # whole file; the runs of 23-25/10/2026 failed in 0 s for one)
      - name: Python packages, Qt as its three wheels without WebEngine
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          python -c "import PySide6.QtQuick3D, PySide6.QtPdf; print('Quick3D and Pdf present')"
      - name: The catalogues, with the compiler of compile_po.py (the runner has no msgfmt)
        run: python tools/compile_po.py
      - name: Tests by group on the runner's desktop (the window on a real desktop before a release)
        run: |
          foreach ($group in "nucleo", "calcoli", "formati", "widget", "finestra") {
            Write-Output "tests/$group"
            python -W default -m unittest discover -s "tests/$group" -t tests
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Build with PyInstaller
        run: |
          python tools/make_ico.py
          pyinstaller --noconfirm build-aux/windows/meridiana.spec
      - name: What the bundle must and must not contain
        run: |
          $i = "dist\Meridiana\_internal"
          foreach ($f in @("$i\PySide6\translations\qtbase_it.qm", "$i\PySide6\qml\QtQuick3D\qmldir",
                           "$i\PySide6\qml\QtQuick3D\Helpers\qmldir", "$i\PySide6\plugins\platforms\qwindows.dll",
                           "$i\PySide6\plugins\texttospeech\qtexttospeech_sapi.dll",
                           "$i\PySide6\plugins\multimedia\windowsmediaplugin.dll",
                           "$i\share\locale\it\LC_MESSAGES\meridiana.mo", "$i\share\fonts\inter\Inter-Regular.ttf",
                           "$i\share\icons\lucide\map.svg", "$i\share\manuale\README.md", "$i\meridiana\ui\qml\Scene.qml",
                           "$i\meridiana\catalog\data\modules_cec.json.gz", "$i\meridiana\assistant\kokoro_worker.py",
                           "$i\pvlib\data\LinkeTurbidities.h5")) {
            if (-not (Test-Path $f)) { Write-Error "missing: $f"; exit 1 }
          }
          foreach ($f in @("$i\PySide6\Qt6WebEngineCore.dll", "$i\PySide6\qml\QtWebEngine", "$i\PySide6\Qt63DRender.dll",
                           "$i\PySide6\Qt6Charts.dll", "$i\PySide6\avcodec-*.dll", "$i\PySide6\plugins\qmltooling",
                           "$i\PySide6\plugins\texttospeech\qtexttospeech_mock.dll", "$i\onnxruntime")) {
            if (Test-Path $f) { Write-Error "must not be there: $f"; exit 1 }
          }
          "bundle: {0:N0} MB" -f ((Get-ChildItem dist\Meridiana -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
      # on the runner's desktop, not offscreen: offscreen Qt Quick draws in software and the 3D is never drawn;
      # here Direct3D 11 (WARP) draws the scene and the modules' instancing runs
      - name: Self-test of the bundle (a window on the runner's desktop, folders of its own, a sample project)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:MERIDIANA_SELF_TEST_PLATFORM = "windows"
          $env:MERIDIANA_SCREENSHOT = "$PWD\smoke\window.png"
          $p = Start-Process dist\Meridiana\Meridiana.exe -ArgumentList '--self-test', "$PWD\smoke\self-test.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force; Write-Error "the self-test did not end"; exit 1 }
          Get-Content smoke\self-test.txt
          if ($p.ExitCode -ne 0) { Write-Error "self-test: exit code $($p.ExitCode)"; exit 1 }
      - name: Portable zip
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          7z a -tzip -mx=5 "dist\meridiana-$v-windows-x64-portable.zip" .\dist\Meridiana | Out-Null
      - name: Installer (Inno Setup, preinstalled on windows-2025)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found: the image changed, download it as the GTK workflow did"; exit 1 }
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'dev' }
          & $iscc "/DAppVersion=$version" "build-aux\windows\meridiana.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Silent install, start, update over the running program, the project type
        run: |
          $setup = (Get-ChildItem dist -Filter 'meridiana-setup-*.exe' | Select-Object -First 1).FullName
          $opts = '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART'
          $p = Start-Process $setup -ArgumentList $opts -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "install: $($p.ExitCode)"; exit 1 }
          $open = (Get-ItemProperty 'HKCU:\Software\Classes\Meridiana.Project\shell\open\command').'(default)'
          if ($open -notlike '*Meridiana.exe*%1*') { Write-Error "the .meridiana files are not associated: $open"; exit 1 }
          Start-Process "$env:LOCALAPPDATA\Programs\Meridiana\Meridiana.exe"
          Start-Sleep 20
          if (-not (Get-Process Meridiana -ErrorAction SilentlyContinue)) { Write-Error 'the program did not start'; exit 1 }
          $p = Start-Process $setup -ArgumentList ($opts + '/LOG=update.log') -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Error 'Setup did not finish'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "update over a running program: $($p.ExitCode)"; exit 1 }
          Start-Sleep 20
          if (-not (Get-Process Meridiana -ErrorAction SilentlyContinue)) { Write-Error 'the program was not started again'; exit 1 }
          Get-Process Meridiana | Stop-Process
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: meridiana-windows
          if-no-files-found: ignore
          path: |
            dist/meridiana-setup-*.exe
            dist/meridiana-*-windows-x64-portable.zip
            smoke/
            update.log

  release:
    # a v* tag: the installer and the zip, signed, on the release. The only job that can write; it runs nothing
    # of the build. The environment "release" holds the secret (and, if Daniel adds the rule, asks his approval
    # before the job starts); without the secret the job says so and stops before signing anything.
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - name: Signing switched on?
        id: key
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::notice::No MINISIGN_SECRET_KEY: the release is not signed nor published (the Windows files are the artifact of the windows job)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.key.outputs.on == 'true'
        with:
          name: meridiana-windows
          path: artifact
      - name: Sign with the project's key (minisign), checked before anything is uploaded
        if: steps.key.outputs.on == 'true'
        # the installed app runs an update only with this signature (updates.py, the same public key:
        # tests/nucleo/test_updates.py KeyTest); the trusted comment names the file, so another release's
        # installer is not taken for this one
        env:
          PUBLIC_KEY: RWRF+AifJvn/zhz0o7MBObIYHgw9+sWoc4GaBK+qYnJY0AqeJm540y0a
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077
           case "$MINISIGN_SECRET_KEY" in
             "untrusted comment:"*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
             *) printf 'untrusted comment: releases\n%s\n' "$MINISIGN_SECRET_KEY" ;;
           esac | tr -d '\r' > "$key")
          for f in "artifact/dist/meridiana-setup-${GITHUB_REF_NAME}-windows-x64.exe" \
                   "artifact/dist/meridiana-${GITHUB_REF_NAME}-windows-x64-portable.zip"; do
            test -f "$f"
            minisign -S -s "$key" -m "$f" -x "$f.minisig" \
              -t "timestamp:$(date +%s) file:$(basename "$f") hashed" </dev/null
            minisign -V -P "$PUBLIC_KEY" -m "$f" -x "$f.minisig"
          done
          rm -f "$key"
      - name: The release, created if the Flatpak workflow has not yet, with the files attached
        if: steps.key.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup="artifact/dist/meridiana-setup-${GITHUB_REF_NAME}-windows-x64.exe"
          zip="artifact/dist/meridiana-${GITHUB_REF_NAME}-windows-x64-portable.zip"
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                 --title "Meridiana ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "$setup" "$zip" "$setup.minisig" "$zip.minisig" \
            --repo "${GITHUB_REPOSITORY}" --clobber
